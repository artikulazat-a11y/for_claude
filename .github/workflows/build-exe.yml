name: Сборка exe для Windows

on:
  push:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Тесты
        run: python -m pytest -q

      - name: Сборка exe
        run: pyinstaller --noconfirm --onefile --name SubstationEmulator --collect-submodules asyncua --paths . packaging/entry.py

      - name: Проверка exe через OPC UA клиент
        shell: pwsh
        run: |
          # С файлом состояния — как при обычном запуске (включается сохранение и обработчик закрытия окна)
          $state = Join-Path $env:RUNNER_TEMP "smoke_state.json"
          $p = Start-Process -FilePath dist\SubstationEmulator.exe -ArgumentList "--port","4841","--setpoints",$state -PassThru -NoNewWindow
          python tools/smoke_test.py opc.tcp://127.0.0.1:4841/substation/
          $code = $LASTEXITCODE
          Start-Sleep 11  # период сохранения показаний — 10 с
          Stop-Process -Id $p.Id -Force
          if ($code -eq 0 -and -not (Select-String -Path $state -Pattern "Meter.T1.Aplus" -Quiet)) {
            Write-Host "FAIL: показания счётчиков не сохранены в $state"; $code = 1
          }
          exit $code

      - name: Сборка exe эмулятора кондиционера и тестового клиента
        run: |
          pyinstaller --noconfirm --onefile --name ACEmulator --paths . packaging/ac_entry.py
          pyinstaller --noconfirm --onefile --name ACTestClient --paths tools --collect-submodules pymodbus packaging/ac_client_entry.py

      - name: Проверка ACEmulator.exe тестовым клиентом
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ACEmulator.exe -ArgumentList "--port","5020","--time-scale","60","--no-faults" -PassThru -NoNewWindow
          Start-Sleep 3
          dist\ACTestClient.exe --port 5020 --settle 30
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          exit $code

      - name: Архив
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist\SubstationEmulator.exe, README.md, tags.csv release\
          Compress-Archive -Path release\* -DestinationPath SubstationEmulator-win64.zip

      - name: Архив эмулятора кондиционера
        shell: pwsh
        run: |
          New-Item -ItemType Directory ac_release | Out-Null
          Copy-Item dist\ACEmulator.exe, dist\ACTestClient.exe, ac_emulator\README.md ac_release\
          Compress-Archive -Path ac_release\* -DestinationPath ACEmulator-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SubstationEmulator-win64
          path: release/

      - uses: actions/upload-artifact@v4
        with:
          name: ACEmulator-win64
          path: ac_release/

      - name: Публикация в Releases
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(python -c 'import substation_emulator as s; print(s.__version__)')"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/SubstationEmulator.exe SubstationEmulator-win64.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Эмулятор ПС 110/10 кВ $TAG" \
            --notes "Скачайте **SubstationEmulator.exe** и запустите двойным щелчком. Сервер: \`opc.tcp://<IP>:4840/substation/\` (Security None, анонимно). Архив zip дополнительно содержит README и перечень тегов tags.csv. Сборка из коммита $GITHUB_SHA."
          AC_TAG="ac-v$(python -c 'import ac_emulator as a; print(a.__version__)')"
          gh release delete "$AC_TAG" --cleanup-tag --yes || true
          gh release create "$AC_TAG" dist/ACEmulator.exe dist/ACTestClient.exe ACEmulator-win64.zip \
            --target "$GITHUB_SHA" --latest=false \
            --title "Эмулятор кондиционера Modbus TCP $AC_TAG" \
            --notes "Скачайте **ACEmulator.exe** и запустите двойным щелчком: Modbus TCP сервер на порту 502 (другой порт: \`ACEmulator.exe --port 5020\`). **ACTestClient.exe** проверяет его: включает, меняет уставку, читает температуру и вентилятор, вызывает и сбрасывает аварию. Карта регистров — в README.md внутри zip. Сборка из коммита $GITHUB_SHA."
